# CI: runs on every PR and every non-main push. Nothing merges to main unless this is green.
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Notify Feishu
        if: always()
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then S=success; T="✅ CI 通过"; else S=failure; T="❌ CI 失败"; fi
          scripts/notify.sh "$S" "$T：${{ github.repository }}" "- 分支：${{ github.head_ref || github.ref_name }}
          - 提交：\`${GITHUB_SHA:0:7}\` by ${{ github.actor }}
          - PR：${{ github.event.pull_request.html_url || '无' }}
          - 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
